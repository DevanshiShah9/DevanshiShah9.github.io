<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Skills</title>
    <link rel="stylesheet" href="../Skills/style.css"> <!-- Link to your CSS file -->
</head>

<body class="font-sans bg-gray-100">

    <div class="icon-and-skills-container">
        <i class='bx bx-brain text-2xl skills-icon'></i>
        <h1 class="skills">Skills</h1>
        <div class="buttons-container">
            <button class="skills-button active">Skills</button>
            <button class="tools-button">Tools</button>
        </div>

        <div class="skills-content">
        <!-- Skills content will be generated dynamically -->
        </div>

        <div class="tools-content">
            <select id="skills-dropdown">
                <option value="Programming Languages">Programming Languages</option>
                <option value="Data Science/ Machine Learning Libraries">Data Science/ Machine Learning Libraries</option>
                <option value="Database Tools">Database Tools</option>
                <option value="Development Tools & Platforms">Development Tools & Platforms</option>
            </select>
            <div class="selected-content">
                <!-- Skills content will be displayed here -->
            </div>
        </div>
        
        

    </div>

    <script src="../Skills/script.js"></script>

</body>

</html>
